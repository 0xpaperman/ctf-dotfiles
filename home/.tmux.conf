# ~/.tmux.conf - remote CTF box
#
# Clipboard note: the xclip pipes from the local Kali config are gone.
# `set-clipboard on` makes tmux emit OSC 52, which rides the SSH connection
# up to the local terminal. Needs terminal support:
#   Alacritty / Ghostty / Kitty / WezTerm  - works out of the box
#   iTerm2 - Settings > General > Selection > "Applications in terminal
#            may access clipboard"
#   Terminal.app - not supported; hold Option and drag-select instead

set -g default-command "${SHELL}"
set-option -g history-limit 50000
set -g prefix C-b

# vi everywhere
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g mouse on

# ------------------------------------------------------------- clipboard
set -g set-clipboard on

# Keyboard bindings (copy without exiting copy mode)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi Enter send-keys -X copy-selection

# Override mouse drag behavior:
# 1. Start selection without attaching auto-copy triggers
bind -T copy-mode-vi MouseDrag1Pane send-keys -X begin-selection
# 2. Prevent releasing mouse from auto-copying or clearing selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# --------------------------------------------------------------- quality
set -g base-index 1
setw -g pane-base-index 1
set -sg escape-time 10
set -g renumber-windows on
set -g display-time 2000
set -g status-interval 5

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "reloaded"

# Splits that keep the current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
